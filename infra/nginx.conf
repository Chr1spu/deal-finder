server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app: every route it owns is served by
    # index.html, and only a genuinely missing asset is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same contract as the vite dev proxy: strip /api and forward to the API
    # service. The browser therefore only ever makes same-origin requests, so
    # no fetch URL in frontend/src/api.js changes between dev and production.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full deal scan is minutes of vector queries. It is served from a
        # cache so a request never waits on one, but GET /deals/{id} values a
        # listing live and can legitimately take a while.
        proxy_read_timeout 120s;
    }
}
